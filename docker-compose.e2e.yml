# docker-compose.e2e.yml — the e2e stacks: the Milvus the gateway translates
# to, plus the two reference databases the parity suites replay the same
# queries against (real Elasticsearch, real Postgres + pgvector).
#
#   docker compose -f docker-compose.e2e.yml up -d --wait
#   make e2e
#
# Host ports dodge the classics so the stack boots next to a local
# Postgres/Elasticsearch: PG 15432, ES 19200; Milvus stays 19530/9091.
# Milvus has no in-container healthcheck — callers poll
# http://127.0.0.1:9091/healthz until it answers (see make e2e / the E2E
# workflow).
services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 12

  rustfs:
    # S3-compatible storage backing Milvus. RustFS keeps its docker hub
    # repository alive (MinIO's was removed in 2025); creds stay
    # minioadmin/minioadmin so Milvus's defaults need no override.
    image: rustfs/rustfs:1.0.0
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: minioadmin
      RUSTFS_SECRET_KEY: minioadmin
      RUSTFS_CONSOLE_ENABLE: "false"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 3s
      retries: 24

  milvus:
    # CI pulls the released image matching the go.mod client version; point
    # LYREBIRD_E2E_MILVUS_IMAGE at a local build to skip the big pull.
    image: ${LYREBIRD_E2E_MILVUS_IMAGE:-milvusdb/milvus:v3.0.2}
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: rustfs:9000
    volumes:
      - milvus_data:/var/lib/milvus
      - ./milvus-user.e2e.yaml:/milvus/configs/user.yaml:ro
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      - etcd
      - rustfs

  elasticsearch:
    # Elastic publishes this tag to Docker Hub as an official image too;
    # the hub copy pulls through registry mirrors where docker.elastic.co
    # is unreachable.
    image: elasticsearch:8.17.4
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "19200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "15432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 24

volumes:
  etcd_data:
  rustfs_data:
  milvus_data:

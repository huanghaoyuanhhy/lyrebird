name: E2E

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

env:
  go-version: '1.27'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  e2e:
    name: E2E (milvus + es + pg via docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go ${{ env.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go-version }}
          cache: true
      - name: Boot the e2e stacks (milvus, elasticsearch, postgres+pgvector)
        run: |
          docker compose -f docker-compose.e2e.yml up -d --wait
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:9091/healthz > /dev/null; then
              echo "milvus healthy"
              exit 0
            fi
            sleep 2
          done
          echo "milvus did not become healthy in 120s"
          docker compose -f docker-compose.e2e.yml logs milvus
          exit 1
      - name: Run the e2e suites (full-stack + parity)
        run: make e2e
      - name: Dump service logs
        if: failure()
        run: docker compose -f docker-compose.e2e.yml logs > /tmp/e2e-services.log
      - name: Upload service logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-services-logs
          path: /tmp/e2e-services.log

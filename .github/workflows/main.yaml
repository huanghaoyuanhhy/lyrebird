name: Test

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_dispatch:

env:
  go-version: '1.27'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go ${{ env.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go-version }}
          cache: true
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Not gofmt-ed:"
            echo "$unformatted"
            exit 1
          fi
      - name: go vet
        run: go vet ./...

  unit-test-go:
    name: Unit test go
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go ${{ env.go-version }}
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.go-version }}
          cache: true
      - name: Unit test with coverage
        run: go test --race -coverprofile=coverage.out -covermode=atomic ./...
      - name: Report coverage
        run: go tool cover -func=coverage.out

  # ci-passed is reconciled by the separate "CI label" workflow: `needs` cannot
  # see jobs in another workflow, so an aggregate gate across Test and E2E has
  # to run from a workflow_run trigger (see ci-label.yaml).
